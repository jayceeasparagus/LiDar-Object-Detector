pointcloud_inspector_node:
  ros__parameters:
    use_sim_time: true
    pointcloud_topic: /lidar/points
    min_range: 0.15
    max_range: 10.0
    voxel_size: 0.05
    clustering_distance: 0.30
    min_cluster_size: 8
    max_cluster_size: 20000
    min_z: -0.12
    max_z: 1.5
    tracking_association_distance: 1.0
    tracking_max_missed_frames: 3
    tracking_process_noise: 0.05
    tracking_measurement_noise: 0.1
