pointcloud_inspector_node:
  ros__parameters:
    use_sim_time: true

    pointcloud_topic: /lidar/points

    min_range: 0.1
    max_range: 30.0

    voxel_size: 0.05

    clustering_distance: 0.20
    min_cluster_size: 10
    max_cluster_size: 100000

    min_z: -0.2
    max_z: 1.5